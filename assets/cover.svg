<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="KitchenManager. Kitchen inventory with barcode scanning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d08"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2418" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <rect x="72" y="96" width="112" height="4" fill="#fbbf24"/>

  <text x="72" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#fcd34d" letter-spacing="4">BARCODE-DRIVEN INVENTORY</text>

  <text x="72" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="94" font-weight="700" fill="#f8fafc">KitchenManager</text>

  <text x="72" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#a8a29e">Scan what you own, track minimum stock, get a shopping list.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#e7e5e4">
    <rect x="72" y="440" width="170" height="44" rx="8" fill="#241d10" stroke="#4a3b18"/>
    <text x="92" y="468">React TS</text>
    <rect x="256" y="440" width="150" height="44" rx="8" fill="#241d10" stroke="#4a3b18"/>
    <text x="276" y="468">Flask</text>
    <rect x="420" y="440" width="160" height="44" rx="8" fill="#241d10" stroke="#4a3b18"/>
    <text x="440" y="468">SQLite</text>
    <rect x="594" y="440" width="320" height="44" rx="8" fill="#241d10" stroke="#4a3b18"/>
    <text x="614" y="468">Open Food Facts</text>
  </g>

  <text x="72" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#78716c">github.com/lucabae/KitchenManager</text>
</svg>
